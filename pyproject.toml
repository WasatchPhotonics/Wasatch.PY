[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "wasatch"
version = "2.5.3"

description= "Application-level driver for Wasatch Photonics spectrometers"
keywords = [ "wasatch", "wasatchphotonics", "spectrometer", "raman" ]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "MIT"
license-files = [ "LICEN[CS]E*" ]

requires-python = ">=3.9"
readme = "README.md"

dependencies = [
    "bleak",
    "build",        # for maintainers
    "crcmod",
    "future",
    "numpy",
    "pexpect",
    "psutil",
    "pyftdi",
    "pygtail",
    "pyudev",
    "pyusb",
    "requests",
    "seabreeze",
    "six",
    "twine",        # for PyPi

    "pywin32; platform_system=='Windows'",
    "ids_peak; platform_system=='Windows'",
]

authors = [
  { name="Mark Zieg", email="mzieg@wasatchphotonics.com" },
  { name="Chris Grainger", email="cgrainger@wasatchphotonics.com" },
]

[project.urls]
Issues = "https://github.com/WasatchPhotonics/Wasatch.PY/issues"
Homepage = "https://github.com/WasatchPhotonics/Wasatach.PY"
Changelog = "https://github.com/WasatchPhotonics/Wasatch.PY/blob/master/CHANGELOG.md"
Repository = "https://github.com/WasatchPhotonics/Wasatch.PY.git"
Documentation = "https://wasatchphotonics.com/enlighten"

[tool.setuptools.packages.find]
where=["."]
include=["wasatch"]
exclude=[]
